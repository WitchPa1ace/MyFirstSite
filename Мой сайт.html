    <div class="modal" id="myModal">
        <div class="modalwrap">
            <div class="modalwindow">
                <div class="crossbutton">
                    <button onclick="closeModal()" class="crossbutton">
                        <img class="button_image" src="crossbutton.png " />
                    </button>
                </div>
                <h1>Невероятно!</h1>
                <p>По вторникам сайт не работает</p>
                <p>Кто бы мог подумать!</p>
            </div>
        </div>

    <script>
        const overlay = document.getElementById("myModal");
    function ScriptQuote(){
    alert('СЕГОДНЯ БЫЛО ЗАВТРА ВЧЕРА');
    }
    function openModal() {
            overlay.style.display = 'flex';
        }
        
    function closeModal() {
        
            overlay.style.display = 'none';
        }
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
            console.log("in modal")
            closeModal();
        }
        console.log("not in modal")
                
        })
    function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const themeButton = document.querySelector('.theme-toggle');
            if (document.body.classList.contains('dark-theme')) {
                themeButton.textContent = 'Светлая тема';
            } else {
                themeButton.textContent = 'Тёмная тема';
            }
        }
    document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });    
    </script>
